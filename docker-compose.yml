services:
  pickems-copa-2026:
    image: landoanelise/pickems-copa-2026:latest
    pull_policy: always
    container_name: pickems-copa-2026
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "3000:3000"
    environment:
      - SITE_URL=${SITE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CRON_SECRET=${CRON_SECRET}

  cron:
    image: landoanelise/pickems-copa-2026:latest
    pull_policy: always
    container_name: pickems-copa-2026-cron
    restart: unless-stopped
    depends_on:
      - pickems-copa-2026
    environment:
      - APP_URL=http://pickems-copa-2026:3000
      - CRON_SECRET=${CRON_SECRET}
    entrypoint: /cron.sh
